      .title { font-size: 78px; font-weight: 800; letter-spacing: 5px; }
      .bottom-title { font-size: 58px; font-weight: 800; letter-spacing: 4px; }
      .sub { font-size: 31px; font-weight: 500; letter-spacing: 2px; }
      .bottom-sub { font-size: 25px; font-weight: 500; letter-spacing: 1px; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 6px; }
      .num { font-size: 36px; font-weight: 800; }
      .icon { fill: none; stroke: currentColor; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2500" height="1686" fill="url(#canvas)"/>

  <!-- 01 / nearby coffee -->
