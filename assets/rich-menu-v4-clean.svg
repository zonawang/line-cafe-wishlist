    <rect width="794" height="787" rx="58" fill="#294D3F"/>
    <g transform="translate(48 45)">
      <rect width="118" height="50" rx="25" fill="#F2D493"/>
      <text x="59" y="36" text-anchor="middle" class="sans num" font-size="30" fill="#233D32">04</text>
