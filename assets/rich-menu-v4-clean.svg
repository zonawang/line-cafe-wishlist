      <path d="M184 219c-45 0-65 34-65 61 0 45 65 91 65 91s65-46 65-91c0-27-20-61-65-61Zm0 84a25 25 0 1 1 0-50 25 25 0 0 1 0 50Z" fill="#E4B76B"/>
